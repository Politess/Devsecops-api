# Checkov configuration
# Every skipped check has a documented reason.
# Undocumented skips are a red flag in security reviews.

soft-fail: false
framework:
  - terraform

skip-check:
  # CKV_AWS_91: ALB access logging requires an S3 bucket.
  # Acceptable for a portfolio project — enable in real production.
  - CKV_AWS_91

  # CKV_AWS_150: ALB deletion protection — intentionally off so the
  # demo stack can be torn down cleanly with terraform destroy.
  - CKV_AWS_150

  # CKV2_AWS_28: WAF on ALB — out of scope for this project tier.
  - CKV2_AWS_28

  # CKV_AWS_103 / CKV2_AWS_20 / CKV_AWS_378: HTTPS on the ALB requires
  # a domain name + ACM certificate. HTTP-only for simplicity.
  # In production: add ACM cert and redirect HTTP to HTTPS.
  - CKV_AWS_103
  - CKV2_AWS_20
  - CKV_AWS_378

  # CKV2_AWS_12: Default security group restriction — the app uses
  # dedicated security groups (alb, ecs_tasks); the default SG is unused.
  - CKV2_AWS_12

  # CKV2_AWS_11: VPC flow logging requires extra S3 storage and cost.
  # Out of scope for a demo; enable for production network monitoring.
  - CKV2_AWS_11
